[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nn_expansion"
version = "1.0.0"
description = "Replica theory and simulations for 'New role for circuit expansion for learning in neural networks' (Phys. Rev. E 103, 022404, 2021)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "joblib>=1.3"]

[project.optional-dependencies]
gpu = ["torch>=2.1"]
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["nn_expansion*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.11"
files = ["nn_expansion", "experiments"]
ignore_missing_imports = true
